# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.


###########################################
# Job Queue/eject               
###########################################



###########################################
# Mcu               
###########################################

[mcu]
serial: /dev/serial/by-id/SEU_ID_DA_MCU

[temperature_sensor MCU]
sensor_type: temperature_mcu

###########################################
# Printer               
###########################################

[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 4000
max_z_velocity: 15
square_corner_velocity: 5.0
max_z_accel: 300

###########################################
# INCLUDE               
###########################################

#[include ADXL345.cfg]
[include mainsail.cfg]
[include macro.cfg]
[include timelapse.cfg]
[include btt-sfs-v2.cfg]
[include shell_command.cfg]
#[include mmu/optional/client_macros.cfg]
#[include mmu/base/*.cfg]
#[include mmu/macros/*.cfg]

###########################################
# EXCLUDE               
###########################################

[exclude_object]

###########################################
# Stepper               
###########################################

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 250
homing_speed: 75

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 230
homing_speed: 75

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
position_min: -6

[bltouch]
sensor_pin: ^PC14
control_pin: PA1
x_offset: -52
y_offset: -11
speed: 10
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3

[safe_z_home]
home_xy_position: 160,120
speed: 250
z_hop: 7
z_hop_speed: 10

###########################################
# Tmc2209              
###########################################

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650

###########################################
# Extruder         
###########################################

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 7.4
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 300

###########################################
# Heater      
###########################################

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

###########################################
# Fan         
###########################################

[heater_fan heatbreak_cooling_fan]
pin: PC7

[heater_fan controller_fan]
pin: PB15
heater: heater_bed
heater_temp: 45.0

[fan]
pin: PC6

###########################################
# Input         
###########################################

[input_shaper]
shaper_type_x: 3hump_ei
shaper_freq_x: 77.2
shaper_type_y: mzv
shaper_freq_y: 39   # conforme o gráfico do eixo Y

###########################################
# Pc Temp        
###########################################

[temperature_sensor PC]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

###########################################
# Board Pins               
###########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

###########################################
# skew correction             
###########################################

[skew_correction]

[force_move]
enable_force_move: True

