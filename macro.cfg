###########################################
# Clean Nozzle   
########################################### 

[gcode_macro CLEAN_NOZZLE]
description: Limpa o bico na escova por aproximadamente 30 segundos
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    G90

    # Vai para o início da escova
    G1 X238 F3000

    # Esfrega 75 vezes de um lado para o outro
    {% for i in range(75) %}
        G1 X244.5 F2000
        G1 X238 F2000
    {% endfor %}

