###########################################
# BED MESH            
###########################################

[bed_mesh]
speed: 200
horizontal_move_z: 7
mesh_min: 30,40
mesh_max: 195,200
probe_count: 4,4
mesh_pps: 2,2
fade_start: 1
fade_end: 10
fade_target: 0
algorithm: bicubic
adaptive_margin: 5

[gcode_macro G29]
gcode:
    BED_MESH_CALIBRATE

[gcode_macro MESH_ADAPTIVE]
description: Cria mesh adaptativo na area da peca
gcode:
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1

###########################################
# Probe cali            
###########################################

[gcode_macro PROBE_CALIBRATE_SAFE]
gcode:
    G28
    PROBE_CALIBRATE

###########################################
# M600            
###########################################    

[gcode_macro M600]
description: Troca de filamento estilo Marlin para Direct Drive
gcode:
    {% set X = params.X|default(0)|float %}
    {% set Y = params.Y|default(220)|float %}
    {% set Z = params.Z|default(10)|float %}
    
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    
    G91
    G1 E-2 F2400         ; retrai 2mm (ideal para direct drive)
    G1 Z{Z} F600         ; sobe o bico
    G90
    G1 X{X} Y{Y} F6000   ; move para trás para trocar o filamento
    
    G91
    G1 E-15 F1000        ; puxa o filamento pra fora (direct drive)
    G90

    M117 Insira o novo filamento e depois clique em RESUME

