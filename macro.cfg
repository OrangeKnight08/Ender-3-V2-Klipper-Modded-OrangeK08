###########################################
# TEMP            
###########################################

[gcode_macro ABS]
gcode:
    M104 S240         ; Hotend 240°C para ABS
    M140 S100         ; Mesa 100°C para ABS
    M190 S100         ; Espera a mesa aquecer a 100°C
    M109 S240         ; Espera o hotend aquecer a 240°C

[gcode_macro PLA]
gcode:
    M104 S210         ; Hotend 210°C para PLA
    M140 S60          ; Mesa 60°C para PLA
    M190 S60          ; Espera a mesa aquecer a 60°C
    M109 S210         ; Espera o hotend aquecer a 210°C

[gcode_macro TPU]
gcode:
    M104 S230         ; Hotend 230°C para TPU
    M140 S50          ; Mesa 50°C para TPU
    M190 S50          ; Espera a mesa aquecer a 50°C
    M109 S230         ; Espera o hotend aquecer a 230°C

[gcode_macro PETG]
gcode:
    M104 S240         ; Hotend 240°C para PETG
    M140 S75          ; Mesa 75°C para PETG
    M190 S75          ; Espera a mesa aquecer a 75°C
    M109 S240         ; Espera o hotend aquecer a 240°C

